
name: Daily Contribution Graph

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate contribution graph
        run: python scripts/generate_graph.py

      - name: Commit updated SVG
        run: |
          if ! git diff --quiet -- assets/contribution-graph.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/contribution-graph.svg
            git commit -m "Update contribution graph"
            git push
          else
            echo "Contribution graph has not changed."
          fi
